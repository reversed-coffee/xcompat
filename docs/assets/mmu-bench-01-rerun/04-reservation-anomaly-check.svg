<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" role="img" aria-labelledby="title desc"><title id="title">Reservation anomaly check</title><desc id="desc">The ratio of 16 MiB to 256 MiB latency for the initial run and five reruns. The horizontal axis is logarithmic.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0.5" y="0.5" width="879" height="509" rx="14" fill="#161b22" stroke="#30363d"/><text x="26" y="32" font-size="12" fill="#49c9b0" font-weight="700" text-anchor="start">XCOMPAT / MMU  ·  RESERVATION RERUNS  /  04</text><text x="26" y="68" font-size="25" fill="#f0f6fc" font-weight="700" text-anchor="start">Does the original slowdown recur?</text><text x="26" y="94" font-size="14" fill="#a8b3c1" font-weight="400" text-anchor="start">16 MiB / 256 MiB latency ratio  ·  above 1× means 16 MiB is slower</text><rect x="89" y="111" width="13" height="13" rx="2" fill="#f2b36f"/><text x="110" y="123" font-size="13" fill="#a8b3c1" font-weight="400" text-anchor="start">16 MiB slower</text><rect x="269" y="111" width="13" height="13" rx="2" fill="#79b8ff"/><text x="290" y="123" font-size="13" fill="#a8b3c1" font-weight="400" text-anchor="start">256 MiB slower</text><text x="846" y="123" font-size="12" fill="#a8b3c1" font-weight="700" text-anchor="end">16 MiB / 256 MiB (µs)</text><line x1="149" y1="151" x2="149" y2="414" stroke="#303944" stroke-width="1"/><text x="149" y="437" font-size="12" fill="#a8b3c1" font-weight="400" text-anchor="middle">0.5×</text><line x1="275.75" y1="151" x2="275.75" y2="414" stroke="#49c9b0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="275.75" y="437" font-size="12" fill="#a8b3c1" font-weight="400" text-anchor="middle">1×</text><line x1="402.5" y1="151" x2="402.5" y2="414" stroke="#303944" stroke-width="1"/><text x="402.5" y="437" font-size="12" fill="#a8b3c1" font-weight="400" text-anchor="middle">2×</text><line x1="529.25" y1="151" x2="529.25" y2="414" stroke="#303944" stroke-width="1"/><text x="529.25" y="437" font-size="12" fill="#a8b3c1" font-weight="400" text-anchor="middle">4×</text><line x1="656" y1="151" x2="656" y2="414" stroke="#303944" stroke-width="1"/><text x="656" y="437" font-size="12" fill="#a8b3c1" font-weight="400" text-anchor="middle">8×</text><text x="26" y="179" font-size="14" fill="#d0dae6" font-weight="700" text-anchor="start">Initial</text><line x1="275.75" y1="174" x2="597.733" y2="174" stroke="#f2b36f" stroke-width="5"/><circle cx="597.733" cy="174" r="5.5" fill="#f2b36f"/><text x="608.733" y="179" font-size="13" fill="#f2b36f" font-weight="700" text-anchor="start">5.82×</text><text x="846" y="179" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end">14.666 / 2.521</text><line x1="26" y1="196" x2="846" y2="196" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4"/><text x="26" y="222" font-size="14" fill="#d0dae6" font-weight="400" text-anchor="start">Run 1</text><line x1="275.75" y1="217" x2="522.809" y2="217" stroke="#f2b36f" stroke-width="5"/><circle cx="522.809" cy="217" r="5.5" fill="#f2b36f"/><text x="533.809" y="222" font-size="13" fill="#f2b36f" font-weight="700" text-anchor="start">3.86×</text><text x="846" y="222" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end">10.777 / 2.791</text><text x="26" y="265" font-size="14" fill="#d0dae6" font-weight="400" text-anchor="start">Run 2</text><line x1="275.75" y1="260" x2="212.109" y2="260" stroke="#79b8ff" stroke-width="5"/><circle cx="212.109" cy="260" r="5.5" fill="#79b8ff"/><text x="201.109" y="265" font-size="13" fill="#79b8ff" font-weight="700" text-anchor="end">0.71×</text><text x="846" y="265" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end">10.559 / 14.955</text><text x="26" y="308" font-size="14" fill="#d0dae6" font-weight="400" text-anchor="start">Run 3</text><line x1="275.75" y1="303" x2="200.193" y2="303" stroke="#79b8ff" stroke-width="5"/><circle cx="200.193" cy="303" r="5.5" fill="#79b8ff"/><text x="189.193" y="308" font-size="13" fill="#79b8ff" font-weight="700" text-anchor="end">0.66×</text><text x="846" y="308" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end">6.389 / 9.658</text><text x="26" y="351" font-size="14" fill="#d0dae6" font-weight="400" text-anchor="start">Run 4</text><line x1="275.75" y1="346" x2="557.635" y2="346" stroke="#f2b36f" stroke-width="5"/><circle cx="557.635" cy="346" r="5.5" fill="#f2b36f"/><text x="568.635" y="351" font-size="13" fill="#f2b36f" font-weight="700" text-anchor="start">4.67×</text><text x="846" y="351" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end">14.646 / 3.135</text><text x="26" y="394" font-size="14" fill="#d0dae6" font-weight="400" text-anchor="start">Run 5</text><line x1="275.75" y1="389" x2="233.814" y2="389" stroke="#79b8ff" stroke-width="5"/><circle cx="233.814" cy="389" r="5.5" fill="#79b8ff"/><text x="222.814" y="394" font-size="13" fill="#79b8ff" font-weight="700" text-anchor="end">0.80×</text><text x="846" y="394" font-size="13" fill="#f0f6fc" font-weight="400" text-anchor="end">5.452 / 6.857</text><line x1="26" y1="461" x2="854" y2="461" stroke="#30363d" stroke-width="1"/><text x="26" y="486" font-size="12" fill="#a8b3c1" font-weight="400" text-anchor="start">16 MiB is slower in 2 of 5 reruns; the direction is not consistent.</text><text x="854" y="486" font-size="11" fill="#637487" font-weight="700" text-anchor="end">5 RERUNS · 64 KiB PAGES</text></g></svg>
